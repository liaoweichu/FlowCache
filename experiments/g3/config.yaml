# G3-P1: Selective Lossless Migration
# ============================================================
# 当前阶段验证：选择性迁移能否在相同 GPU/CPU 容量下减少无效搬运，
# 并在计入 D2H/H2D/hold/controller 后优于 always-migrate 消融。
# open-loop 的 arrival-window rate 仅为 offered load；不得作为 throughput gate。
#
# G3-P1 相对 protocol-invalid G3 的修复：
#   1. 移除 replay_seeds 概念，并按 task_id（165 组）聚类 bootstrap
#   2. always-migrate 仅保留为独立消融，不再代表 FlowCache
#   3. 使用有界、未校准的 reuse likelihood proxy 做迁移 admission
#   4. recency 按有效 GPU 容量归一化，避免 GPU 容量大于固定 horizon
#      时所有 LRU victim 都被判为“永不复用”
#   5. share_count 只统计决策时可见的滑动历史窗口，禁止 future leakage
#
# 前置：G1′ PASSED（headroom=45.80% @ 1 GiB c=4）
# 复用 G1′ 的物理前缀访问流，不重新运行 τ-bench 对话。
# 复用 experiments/e1/compare_oracle.py 的 baseline 类。

# G0 冻结配置（从 g1prime/config.yaml 继承）
g0:
  model_id: "/root/autodl-tmp/models/Qwen2.5-7B-Instruct/snapshots/master"
  revision: ""
  template_hash: "ca26deeb41864f91"
  config_hash: "6dee333c7bcea6b5"
  adapter_id: "tau_bench_v1"
  block_size: 16
  num_hidden_layers: 28
  num_kv_heads: 4
  head_dim: 128
  dtype: "bfloat16"
  dtype_bytes: 2

# 数据集（复用 G1′ 物理前缀访问流）
datasets:
  - tau_bench  # 1320 episodes（165 tasks × 8 τ-bench seeds），单次运行

# 物理前缀访问流来源（G1′ 产物）
trace_source:
  access_trace_dir: "../g1prime/physical_traces/"
  # access_trace_c{1,4,8}.jsonl
  episodes_total: 1320  # G1′ 全量；G3′ 一次跑完
  tasks_total: 165      # bootstrap 聚类单元
  seeds_tau_bench: 8    # 每个 task 有 8 个 τ-bench seed

# 绝对 KV 容量（沿用 G1′ 的 GiB 档位，聚焦通过 cell）
capacity:
  budgets_gib: [1, 2, 4]  # 排除 6 GiB（G1′ headroom ≈ 0%）
  main_cell: {capacity_gib: 1, concurrency: 4}  # G1′ 最佳点

# 并发模拟（沿用 G1′ 的 c=1/4/8）
concurrency:
  levels: [1, 4, 8]
  # c=1 顺序基线；c=4 主判定；c=8 高并发

# 成本标定（云端实测，G3.6.1）
cost_calibration:
  output_file: "cost-model.json"  # 相对于 experiments/g3/ 目录
  parent_lengths: [512, 1024, 2048, 4096, 8192]  # tokens
  concurrency_levels: [1, 4, 8]
  repetitions: 100  # 每点测 100 次取中位数
  r2_threshold: 0.95

# Baselines（复用 experiments/e1/compare_oracle.py 的类）
baselines:
  lower_bound:
    - name: no_cache
      enabled: true
  simple_heuristic:
    - name: apc_lru
      enabled: true
    - name: gdsf
      enabled: true
    - name: sizecost
      enabled: true
  oracle:
    - name: oracle_cost
      enabled: true
  tiered_ablation:
    - name: flowcache_always_migrate
      enabled: true
      # 所有 miss 都进入 GPU；所有 GPU victim 都迁移到 CPU。
    - name: flowcache_selective_migrate_only
      enabled: true
      # 所有 miss 都进入 GPU；仅保留上一轮 selective CPU migration。
  flowcache:
    - name: flowcache_lossless
      enabled: true
      # 因果 cost-aware GPU admission/bypass + selective CPU migration。

# FlowCache-Lossless controller 配置（G3′ 修复后）
flowcache:
  action_space: "A0"  # 无损：GPU BF16 ↔ CPU BF16 ↔ Evict
  controller_variant: "selective_value"
  # 借鉴 Oracle-Cost 的成本排序目标，但不读取 future_accesses。
  # 只使用当前/历史访问，完整未来索引在 runner 中与在线策略物理隔离。
  gpu_admission_policy: "oracle_cost_proxy"
  reuse_estimator: "heuristic"  # heuristic | survival（不用 GNN）
  # heuristic 估计器参数
  heuristic:
    beta: 0.005  # age 衰减率（~200 step 半衰期）
    alpha: 0.5   # share_count 权重
    position_weights:
      early: {block_idx_lt: 10, weight: 1.5}
      mid: {block_idx_lt: 50, weight: 1.0}
      late: {weight: 0.7}
    horizon: 1000  # H 窗口（step）
  # G3′: safety_margin 从 0.10 降到 0.05（CPU 层修复后可减少缩容）
  safety_margin: 0.05
  # legacy 字段，仅为旧结果兼容；selective policy 不使用固定 R 阈值
  migrate_threshold: 0.01
  selective_migration:
    # Incoming GPU value + displaced-victim residual 必须超过当前 GPU
    # incumbent value + margin；否则本次 miss 正常计算但不保留缓存副本。
    gpu_admission_margin_ms: 0.0
    # 首次出现只有小的因果 cold-start prior；旁路不清除历史计数，
    # 再次访问会提高 observed-reuse confidence。仅在 validation 冻结。
    gpu_admission_cold_start_prior: 0.05
    # 首次出现块仅在 prefill 明显低于 victim，或 victim 已有更强历史复用证据时
    # 使用 cold-start prior；等成本且等证据的候选保持保守准入。
    gpu_admission_cold_start_cost_ratio: 0.5
    gpu_admission_confidence_scale: 1.0
    # proxy_b 是 [0,1] 的未校准 likelihood proxy，不宣称概率。
    # V_new = proxy_b*(prefill-H2D) - D2H - hold。
    # V_new 必须严格大于此阈值才允许进入 CPU。
    minimum_net_benefit_ms: 0.0
    # CPU 满时，新候选还必须超过被替换 block 的 value + margin。
    cpu_admission_margin_ms: 0.0
    # recency = exp(-age / (effective_gpu_capacity * multiplier))。
    age_scale_capacity_multiplier: 1.0
    # share_count 仅由 trailing access window 的已发生访问构造。
    share_window_accesses: 1000
    share_count_cap: 8
    reuse_count_scale: 2.0
    signal_weights:
      share: 0.45
      frequency: 0.35
      position: 0.20
    # 工程初值；tune_selective_migration.py 只在 validation split 调整，
    # 选中后写入冻结配置，held-out test 不得再次调参。
    expected_cpu_residence_steps: 100
    hold_cost_weight: 1.0
  # 回退策略：controller 异常时回退 SizeCost-LRU
  fallback: "sizecost"
  # CPU pinned buffer 容量（block 数；-1 = 无限制）
  cpu_capacity_blocks: -1
  # 决策评分权重
  score_lambda: 0.1  # hold_cost 权重

# 统计判定（G3′: task_id 聚类 bootstrap）
verdict:
  p95_ttft_threshold: 0.15  # 15% 改善
  throughput_drop_threshold: 0.05  # 5% 非劣
  require_measured_ttft: true
  require_closed_loop_throughput: true
  bootstrap_samples: 1000
  bootstrap_unit: "task_id"  # G3′: 165 个 task 聚类（原为 seed，已修复）
  ci_level: 0.95
  bonferroni_tests: 18  # 9 cell × 2 主比较
  random_seed: 42

# 网格运行配置（G3′: 移除 replay_seeds，单次跑全部 1320 episodes）
grid:
  cells:  # 9 cell
    - {capacity_gib: 1, concurrency: 1}
    - {capacity_gib: 1, concurrency: 4}  # 主 cell
    - {capacity_gib: 1, concurrency: 8}
    - {capacity_gib: 2, concurrency: 1}
    - {capacity_gib: 2, concurrency: 4}
    - {capacity_gib: 2, concurrency: 8}
    - {capacity_gib: 4, concurrency: 1}
    - {capacity_gib: 4, concurrency: 4}
    - {capacity_gib: 4, concurrency: 8}
  episodes_per_cell: 100000  # 高于 1320，确保覆盖全部 workflow

# W8 冒烟配置
smoke_test:
  enabled: true
  cell: {capacity_gib: 1, concurrency: 4}  # 主 cell
  baselines: [no_cache, apc_lru, gdsf, sizecost, flowcache_always_migrate, flowcache_selective_migrate_only, oracle_cost, flowcache_lossless]
  episodes: 100
  # 用于 W8 前置验证，防止无损驻留不成立时白做量化

# 下一步：在本轮 1283.1 s 异常所在的诊断 cell 做 G3-P1。
# 先用 task-grouped validation 冻结 admission，再用
#   --protocol-test --max-episodes 100000
# 在 held-out test 完成该单 cell 全 trace。不要直接恢复 9-cell 网格。
protocol_test:
  cell: {capacity_gib: 2, concurrency: 4}
  baselines: [gdsf, sizecost, flowcache_always_migrate, flowcache_selective_migrate_only, oracle_cost, flowcache_lossless]
  episodes: 100
  expected_controller_variant: "selective_value"
  output_is_diagnostic_only: true

# 质量抽检配置（closed-loop，G3.6）
quality_check:
  episodes: 20
  checks:
    - task_success_rate_diff_eq_0
    - output_token_identical_rate_eq_1
    - tool_call_sequence_identical_rate_eq_1

# 输出路径（相对于 experiments/g3/ 目录）
output:
  results_dir: "results/"
  figures_dir: "figures/"
  verdict_md: "g3-verdict.md"
  verdict_json: "g3-verdict.json"
  raw_results_csv: "results/raw_results.csv"
