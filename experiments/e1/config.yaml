# E1: Workload Characterization & Cache Opportunity Analysis
# ===========================================================
# Purpose: Prove that real Agent workloads have non-trivial exact-prefix
#   re-access and that offline oracle significantly outperforms LRU/heuristics.
# Gate: G1 (Opportunity)
# Week: W3-W7
#
# G1 v0.4: Single dataset (tau-bench) × 8 seeds = 1320 episodes (165 tasks × 8).
# Block identity is unified to G0 8-tuple version. Resume flag enables
# checkpoint/resume for long-running recording (~7 GPU hours on 4090D).

# --- Model ---
model:
  name: "/root/autodl-tmp/models/Qwen2.5-7B-Instruct/snapshots/master"
  dtype: "bfloat16"
  trust_remote_code: true
  device_map: "auto"

# --- Workload ---
workload:
  datasets: ["tau-bench"]
  seeds: [42, 123, 456, 789, 101112, 131415, 161718, 192021]  # 8 seeds
  tau_bench:
    tasks: 165  # full task set (115 retail + 50 airline)
    user_simulator: "llm_user"
    user_model: "deepseek/deepseek-v4-flash"
    user_provider: "deepseek"
    user_temperature: 0.7
  concurrency: 4  # recording is single-GPU serial; used at replay time

# --- Cache ---
cache:
  block_size: 16  # tokens per block
  kv_budgets: [0.10, 0.25, 0.50, 1.00]  # fraction of peak working set
  scheduling_window_h: 1000  # steps (sliding window for working-set accounting)

# --- Replay ---
replay:
  arrival_process: "poisson"
  arrival_lambda: 4  # avg workflows per scheduling window
  arrival_sources: ["burst_gpt", "poisson"]  # BurstGPT = primary evidence, Poisson = modeling reference
  num_replay_seeds: 3  # 3 replay seeds (arrival-time perturbation), independent of recording seeds
  tool_wait_tolerance: 1.0  # multiplier for recorded tool wait time

# --- Output ---
output:
  trace_dir: "traces/bf16"
  trace_subdirs: ["tau_bench"]
  report_dir: "outputs"
  figure_dir: "figures"
  report_format: ["json", "markdown"]
  resume: true  # checkpoint/resume: skip existing trace files on restart

# --- Baselines ---
# NOTE: This section is DESCRIPTIVE ONLY. compare_oracle.py currently hardcodes
# the baseline list in its main() function; this section documents the
# selection decisions for traceability. To add/remove a baseline at runtime,
# edit compare_oracle.py main(); this section is the single source of truth
# for *which* baselines are enabled and *why* (variant / source paper).
# G1 verdict 模块通过 `experiments/g1/run_grid.py` 调用本配置（读取 baselines
# 列表与 trace_source），产出 experiments/g1/results/raw_results.csv。
baselines:
  # Simple heuristics (block-level, no future information)
  - name: lru
    type: simple_heuristic
    enabled: true
  - name: gdsf
    type: simple_heuristic
    enabled: true
  - name: sizecost
    type: simple_heuristic
    enabled: true
  - name: apc_lru
    type: simple_heuristic
    enabled: true

  # Oracle upper bounds (offline, future-aware)
  - name: belady
    type: oracle
    enabled: true
  - name: oracle_cost
    type: oracle
    enabled: true

  # Closest baselines — inspired variants (no faithful code available or
  # API-level proxy incompatible with block-level trace replay)
  - name: pbkv_inspired
    type: closest_inspired
    enabled: true
    variant: inspired
    source_paper: "arXiv 2605.06472"
    note: "No official code; GraphSAGE-style reuse prediction + chain-aware eviction"
  - name: thunderagent_inspired
    type: closest_inspired
    enabled: true
    variant: inspired
    source_paper: "arXiv 2602.13692 (ICML 2026 Spotlight)"
    note: "API-level proxy not block-level cache; program-aware + 2^{-t} time decay"

  # Closest baseline — faithful reproduction (AutoDL Linux, adapter in progress)
  - name: kvflow_faithful
    type: closest_faithful
    enabled: true
    source_paper: "arXiv 2507.07400 (NeurIPS 2025)"
    note: "AutoDL Linux + CUDA + Rust toolchain; requires τ-bench adapter (SGLang prefix-tree + PlanManager.update_agent_timestep)"
